# ── Cloud overlay ─────────────────────────────────────────────────────
# Activated by:  KEDRO_ENV=cloud
# Only production artifacts are overridden — everything else inherits
# from conf/base/catalog.yml.
#
# Set GCS_BUCKET env var before deploying:
#   export GCS_BUCKET=my-churn-bucket

production_encoders:
  type: pickle.PickleDataset
  filepath: gs://${oc.env:GCS_BUCKET}/churn/models/production_encoders.pkl

production_scalers:
  type: pickle.PickleDataset
  filepath: gs://${oc.env:GCS_BUCKET}/churn/models/production_scalers.pkl

production_model:
  type: pickle.PickleDataset
  filepath: gs://${oc.env:GCS_BUCKET}/churn/models/production_model.pkl
