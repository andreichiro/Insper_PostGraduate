# ── LogisticRegression (Optuna) ──────────────────────────────────────
baseline:
  class_path: sklearn.linear_model.LogisticRegression
  search_space:
    C:
      type: float
      low: 0.01
      high: 10.0
      log: true
    solver:
      type: categorical
      choices: [lbfgs, liblinear, saga]
  init_args:
    max_iter: 1000
    class_weight: balanced
  n_trials: 20
  cv: 5
  scoring: roc_auc

# ── CatBoost (Optuna — expanded grid) ───────────────────────────────
optimization:
  class_path: catboost.CatBoostClassifier
  search_space:
    depth:
      type: int
      low: 3
      high: 10
    iterations:
      type: int
      low: 50
      high: 500
    learning_rate:
      type: float
      low: 0.001
      high: 0.3
      log: true
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 10.0
  init_args:
    verbose: 0
    auto_class_weights: Balanced
  n_trials: 30
  cv: 5
  scoring: roc_auc

# ── XGBoost (Optuna) ────────────────────────────────────────────────
xgboost:
  class_path: xgboost.XGBClassifier
  search_space:
    n_estimators:
      type: int
      low: 50
      high: 500
    max_depth:
      type: int
      low: 3
      high: 10
    learning_rate:
      type: float
      low: 0.001
      high: 0.3
      log: true
    min_child_weight:
      type: int
      low: 1
      high: 10
    subsample:
      type: float
      low: 0.6
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.6
      high: 1.0
  init_args:
    eval_metric: logloss
    verbosity: 0
    scale_pos_weight: 2.74
  n_trials: 30
  cv: 5
  scoring: roc_auc

# ── Evaluation & selection ──────────────────────────────────────────
evaluation:
  split: validation

model_selection:
  metric: roc_auc
