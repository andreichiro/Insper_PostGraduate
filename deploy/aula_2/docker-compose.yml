services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - app-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    entrypoint: ["./dashboard-entrypoint.sh"]
    depends_on:
      api:
        condition: service_started

volumes:
  app-data:
