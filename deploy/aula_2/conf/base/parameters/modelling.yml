baseline:
  class_path: sklearn.linear_model.LogisticRegression
  train_splits:
    - train
  init_args:
    max_iter: 1000
    class_weight: balanced
  search_space:
    C:
      type: float
      low: 0.001
      high: 100.0
      log: true
    solver:
      type: categorical
      choices: ["lbfgs", "liblinear", "saga"]
  n_trials: 20
  cv: 5
  scoring: roc_auc

optimization:
  class_path: catboost.CatBoostClassifier
  init_args:
    verbose: 0
    auto_class_weights: Balanced
  search_space:
    depth:
      type: int
      low: 3
      high: 10
    iterations:
      type: int
      low: 100
      high: 500
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 10.0
  n_trials: 30
  cv: 5
  scoring: roc_auc

xgboost:
  class_path: xgboost.XGBClassifier
  train_splits:
    - train
  init_args:
    eval_metric: logloss
    verbosity: 0
    scale_pos_weight: 1.86
  search_space:
    n_estimators:
      type: int
      low: 50
      high: 500
    max_depth:
      type: int
      low: 3
      high: 10
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    min_child_weight:
      type: int
      low: 1
      high: 10
    subsample:
      type: float
      low: 0.6
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.6
      high: 1.0
  n_trials: 30
  cv: 5
  scoring: roc_auc

evaluation:
  split: validation

model_selection:
  metric: roc_auc
