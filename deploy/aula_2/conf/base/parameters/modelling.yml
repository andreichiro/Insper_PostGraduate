baseline:
  class_path: sklearn.linear_model.LogisticRegression
  random_state: ${random_state}
  train_splits:
    - train
  init_args:
    max_iter: 1000
    class_weight: balanced
  search_space:
    C:
      type: float
      low: 0.001
      high: 100.0
      log: true
    solver:
      type: categorical
      choices: ["lbfgs", "liblinear", "saga"]
  n_trials: 20
  cv: 5
  scoring: roc_auc

optimization:
  class_path: catboost.CatBoostClassifier
  random_state: ${random_state}
  init_args:
    verbose: 0
    auto_class_weights: Balanced
  search_space:
    depth:
      type: int
      low: 3
      high: 10
    iterations:
      type: int
      low: 100
      high: 500
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    l2_leaf_reg:
      type: float
      low: 1.0
      high: 10.0
  n_trials: 30
  cv: 5
  scoring: roc_auc

xgboost:
  class_path: xgboost.XGBClassifier
  random_state: ${random_state}
  train_splits:
    - train
  init_args:
    eval_metric: logloss
    verbosity: 0
    scale_pos_weight: 1.86
  search_space:
    n_estimators:
      type: int
      low: 50
      high: 500
    max_depth:
      type: int
      low: 3
      high: 10
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    min_child_weight:
      type: int
      low: 1
      high: 10
    subsample:
      type: float
      low: 0.6
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.6
      high: 1.0
  n_trials: 30
  cv: 5
  scoring: roc_auc

# Runtime compartilhado (target encoder, CV, Optuna) — troca de classe sem código.
ml_runtime:
  target_encoder:
    class_path: sklearn.preprocessing.LabelEncoder
    init_args: {}
  cross_validation:
    class_path: sklearn.model_selection.StratifiedKFold
    init_args:
      shuffle: true
      random_state: ${random_state}
  optuna_study:
    direction: maximize
  optuna_sampler:
    class_path: optuna.samplers.TPESampler
    init_args:
      seed: ${random_state}

evaluation:
  split: validation
  confusion_matrix:
    function_path: sklearn.metrics.confusion_matrix
    kwargs: {}
  metrics:
    - key: accuracy
      function_path: sklearn.metrics.accuracy_score
      prediction_input: y_pred
      kwargs: {}
    - key: precision
      function_path: sklearn.metrics.precision_score
      prediction_input: y_pred
      kwargs:
        zero_division: 0
    - key: recall
      function_path: sklearn.metrics.recall_score
      prediction_input: y_pred
      kwargs:
        zero_division: 0
    - key: f1
      function_path: sklearn.metrics.f1_score
      prediction_input: y_pred
      kwargs:
        zero_division: 0
    - key: roc_auc
      function_path: sklearn.metrics.roc_auc_score
      prediction_input: y_proba
      kwargs: {}
  derived:
    r2:
      function_path: sklearn.metrics.r2_score
      prediction_input: y_proba
    mape:
      type: mae_as_percent_of_mean_label

model_selection:
  metric: roc_auc
  refit_train_splits:
    - train
    - validation
    - test
