    - name: is_alunos_indiretos_negative
      description: Flag de valor negativo em quantidade de alunos indiretos.
    - name: is_login_google_invalid
      description: Flag de valor inválido em login via Google.
    - name: raw_entry_session_count_month
      description: Quantidade mensal de sessões de entrada brutas.
    - name: ping_entry_session_count_month
      description: Quantidade mensal de sessões de entrada do tipo ping.
    - name: clean_entry_session_count_month
      description: Quantidade mensal de sessões de entrada limpas.
    - name: clean_entry_total_session_minutes_month
      description: Quantidade mensal de minutos em sessões de entrada limpas.
    - name: clean_entry_avg_session_minutes_month
      description: Média mensal de minutos por sessão de entrada limpa.
    - name: interaction_rows_month
