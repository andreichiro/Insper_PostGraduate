    - name: month_signal_class
      description: Classe mensal de sinal observado.
    - name: strict_value_flag
      description: Flag indicando valor estrito.
    - name: active_user_flag
      description: Flag indicando usuário ativo no mês.
    - name: viewed_aula_flag
      description: Flag indicando visualização de aula.
    - name: viewed_plano_flag
      description: Flag indicando visualização de plano.
    - name: viewed_prova_flag
      description: Flag indicando visualização de prova.
    - name: used_ia_flag
