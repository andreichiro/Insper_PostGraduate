    - name: clean_entry_exposed_activity_no_download_flag
      description: Flag indicando exposição em sessão limpa de entrada com atividade, mas sem download.
    - name: month_num
      description: Número sequencial do mês observado.
    - name: next_month
      description: Mês seguinte observado.
    - name: next_month_observed_flag
      description: Flag indicando observação de mês seguinte.
    - name: returned_active_m1
