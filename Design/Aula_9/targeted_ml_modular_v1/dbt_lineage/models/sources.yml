version: 2
sources:
- name: raw_conceptual
  description: Camada documental das tabelas raw que originam a base modelada. Essas fontes existem para explicar a linhagem
    e o significado dos dados brutos, mesmo quando a transformação raw -> modeled acontece fora deste projeto dbt.
  schema: main
  tables:
  - name: dim_teachers
    description: Tabela dimensão que armazena informações dos professores cadastrados na plataforma AprendiZAP.
    columns:
    - name: unique_id
      description: Identificador único do professor.
    - name: utm_origin
      description: Origem UTM do cadastro.
    - name: tela_origem
      description: Tela de origem do cadastro.
    - name: estado
      description: Estado ou UF do professor.
    - name: total_alunos
      description: Total de alunos do professor.
    - name: tipo_total_alunos
      description: Tipo de alunos diretos ou indiretos imputados pelo professor.
    - name: alunos_diretos
      description: Quantidade de alunos diretos.
    - name: alunos_indiretos
      description: Quantidade de alunos indiretos.
    - name: login_google
      description: Indicador se usa login via Google.
    - name: currentstage
      description: Etapa ou série atual em que leciona.
    - name: currentsubject
      description: Disciplina atual em que leciona.
    - name: selectedstages
      description: Etapas selecionadas pelo professor.
    - name: selectedsubjectsem
      description: Disciplinas selecionadas para Ensino Médio.
    - name: selectedsubjectsfundii
      description: Disciplinas selecionadas para Fundamental II.
    - name: visualizou_metodologia_ativa
      description: Flag se visualizou metodologia ativa.
    - name: data_entrada
      description: Data de entrada na plataforma.
  - name: fct_teachers_contents_interactions
    description: Tabela de fatos que registra as interações dos professores com conteúdos da plataforma.
    columns:
    - name: unique_id
      description: Identificador único do professor.
    - name: user_type
      description: Tipo do usuário.
    - name: user_agent_device_type
      description: Tipo de dispositivo usado.
    - name: data_inicio
      description: Data e hora de início da interação.
    - name: event_type
      description: Tipo do evento ou interação.
    - name: content_type
      description: Tipo do conteúdo acessado.
    - name: id_aula
      description: Identificador da aula.
    - name: utm_source
      description: Fonte UTM da sessão.
  - name: fct_teachers_entries
    description: Tabela de fatos que registra as entradas dos professores na plataforma.
    columns:
    - name: unique_id
      description: Identificador único do professor.
    - name: user_type
      description: Tipo do usuário.
    - name: data_inicio
      description: Data e hora de início da sessão.
    - name: data_fim
      description: Data e hora de fim da sessão.
  - name: fct_mari_ia_eventos_isso_ajudou
    description: Tabela de fatos que registra interações com a Mari IA e avalia as respostas recebidas.
    columns:
    - name: user_id
      description: Identificador do usuário associado ao evento.
    - name: date
      description: Data da interação.
    - name: turno
      description: Turno da interação.
    - name: key
      description: Chave do evento ou atributo reportado.
    - name: isso_ajudou
      description: Resposta textual sobre se a interação ajudou.
    - name: isso_ajudou_num
      description: Resposta numérica sobre se a interação ajudou.
  - name: stg_formation
    description: Tabela de staging que registra interações dos usuários com cursos de formação.
    columns:
    - name: unique_id_aprendizap
      description: Identificador do usuário no AprendiZAP.
    - name: itemid
      description: ID do item do curso.
    - name: createdat
      description: Data de criação do registro.
    - name: updatedat
      description: Data da última atualização.
    - name: type
      description: Tipo do item do curso.
    - name: completionstatus
      description: Status de conclusão.
    - name: progress
      description: Progresso percentual.
    - name: questionstatus
      description: Status das questões.
    - name: coursemodulecount
      description: Quantidade de módulos do curso.
    - name: moduleblockcount
      description: Quantidade de blocos do módulo.
    - name: quizquestioncount
      description: Quantidade de questões do quiz.
  - name: stg_mari_ia_conversation
    description: Tabela de staging que armazena conversas com a IA Mari em dados anteriores a 21/02/2025.
    columns:
    - name: id_mari
      description: Identificador da conversa ou thread na Mari.
    - name: createdat
      description: Data de criação da conversa.
    - name: updatedat
      description: Data da última atualização.
    - name: userlastmessage
      description: Última mensagem enviada pelo usuário.
    - name: ailastmessage
      description: Última mensagem enviada pela IA.
    - name: originsource
      description: Fonte de origem da conversa.
    - name: userreaction
      description: Reação do usuário à resposta.
    - name: unique_id_aprendizap
      description: Identificador reconciliado do usuário no AprendiZAP.
  - name: stg_mari_ia_reports
    description: Tabela de staging com relatórios estruturados das interações com a IA Mari em dados posteriores a 20/02/2025.
    columns:
    - name: id_mari
      description: Identificador da conversa ou thread na Mari.
    - name: updatedat
      description: Data da última atualização.
    - name: key
      description: Chave do atributo reportado.
    - name: value
      description: Valor do atributo reportado.
    - name: metadata
      description: Metadados em JSON.
    - name: unique_id_aprendizap
      description: Identificador reconciliado do usuário no AprendiZAP.
  - name: stg_lessons
    description: Tabela de staging que armazena metadados educacionais das aulas disponíveis na plataforma.
    columns:
    - name: id_aula
      description: Identificação da aula.
    - name: titulo
      description: Título da aula.
    - name: nivel
      description: Nível de ensino.
    - name: ano
      description: Ano de ensino.
    - name: ano_em
      description: Ano no recorte de Ensino Médio quando aplicável.
    - name: disciplina
      description: Disciplina de ensino.
    - name: unidade
      description: Unidade de ensino.
    - name: bncc
      description: BNCC atrelada à aula.
    - name: possui_metodologia_ativa
      description: Flag que identifica se existe metodologia ativa.
    - name: total_metodologias_ativa
      description: Contagem de metodologias ativas.
  - name: hotjar_pesquisa_mobile
    description: Tabela contendo informações sobre pesquisas quanto ao uso do AprendiZAP em contexto mobile.
    columns:
    - name: User
      description: Identificação do usuário.
    - name: Date Submitted
      description: Data de envio da resposta.
    - name: Country
      description: País do usuário.
    - name: Source URL
      description: Fonte da pesquisa.
    - name: Device
      description: Tipo de dispositivo.
    - name: Browser
      description: Tipo de navegador.
    - name: OS
      description: Sistema operacional.
    - name: Hotjar User ID
      description: Identificação do usuário no CRM.
    - name: Como você avalia a sua experiência?
      description: Avaliação da experiência.
    - name: Conte-nos sobre a sua experiência...
      description: Descrição da experiência.
    - name: Você topa conversar com a gente para melhorar sua experiência?
      description: Disponibilidade para conversar com o time.
    - name: 'Sentiment for: Conte-nos sobre a sua experiência...'
      description: Sentimento do comentário aberto.
  - name: hotjar_pesquisa_desktop
    description: Tabela contendo informações sobre pesquisas quanto ao uso do AprendiZAP em contexto desktop.
    columns:
    - name: User
      description: Identificação do usuário.
    - name: Date Submitted
      description: Data de envio da resposta.
    - name: Country
      description: País do usuário.
    - name: Source URL
      description: Fonte da pesquisa.
    - name: Device
      description: Tipo de dispositivo.
    - name: Browser
      description: Tipo de navegador.
    - name: OS
      description: Sistema operacional.
    - name: Hotjar User ID
      description: Identificação do usuário no CRM.
    - name: Como você avalia a sua experiência?
      description: Avaliação da experiência.
    - name: Conte-nos sobre a sua experiência...
      description: Descrição da experiência.
    - name: Você topa conversar com a gente para melhorar sua experiência?
      description: Disponibilidade para conversar com o time.
    - name: 'Sentiment for: Conte-nos sobre a sua experiência...'
      description: Sentimento do comentário aberto.
  - name: hotjar_teste_interesse
    description: Tabela contendo informações sobre pesquisas quanto ao uso do AprendiZAP voltadas a interesse e engajamento.
    columns:
    - name: User
      description: Identificação do usuário.
    - name: Date Submitted
      description: Data de envio da resposta.
    - name: Country
      description: País do usuário.
    - name: Source URL
      description: Fonte da pesquisa.
    - name: Device
      description: Tipo de dispositivo.
    - name: Browser
      description: Tipo de navegador.
    - name: OS
      description: Sistema operacional.
    - name: Hotjar User ID
      description: Identificação do usuário no CRM.
    - name: Quais estratégias você utiliza para engajar os alunos desinteressados?
      description: Estratégias usadas para engajar alunos desinteressados.
    - name: Quão útil seria para você discutir desafios educacionais com outros educadores através da nossa plataforma?
      description: Utilidade percebida de discutir desafios com outros educadores.
    - name: 'Sentiment for: Quais estratégias você utiliza para engajar os alunos desinteressados?'
      description: Sentimento do comentário sobre estratégias.
  - name: school_calendar
    description: Calendário escolar raw usado para enriquecer a dimensão de calendário da base modelada.
    columns:
    - name: year
      description: Ano de referência.
    - name: month
      description: Mês numérico de referência.
    - name: month_start
      description: Início do mês de referência.
    - name: uf
      description: UF do calendário.
    - name: rede
      description: Rede de ensino.
    - name: business_days
      description: Quantidade de dias úteis estimados no mês.
    - name: official_holiday_weekdays
      description: Quantidade de feriados oficiais em dias úteis.
    - name: school_days_estimate
      description: Estimativa de dias letivos no mês.
    - name: calendar_source
      description: Fonte do calendário consolidado.
- name: modeled_base
  description: Base modelada oficial usada pelo pipeline de ML. Aqui entram fatos, dimensões e marts limpos, prontos para
    reconstruir a jornada inicial e medir atividade futura.
  database: modelled_base
  schema: main
  tables:
  - name: audit_base_modelada_validation
    description: Auditoria final de validação estrutural da base modelada.
    columns:
    - name: check_name
      description: Nome do check de validação.
    - name: metric_value
      description: Valor medido no check.
    - name: status
      description: Status do check.
    - name: note
      description: Observação complementar do check.
  - name: audit_persona_feature_readiness
    description: Auditoria de prontidão das variáveis usadas em personas e clustering.
    columns:
    - name: feature_name
      description: Nome da variável auditada.
    - name: feature_level
      description: Nível analítico da variável.
    - name: feature_role
      description: Papel analítico da variável.
    - name: definition
      description: Definição curta da variável.
    - name: missing_rate
      description: Proporção de valores ausentes.
    - name: zero_share
      description: Proporção de valores zero.
    - name: std
      description: Desvio-padrão da variável.
    - name: recommended_for_persona_analysis
      description: Flag indicando recomendação para personas.
    - name: recommended_for_persona_ranges
      description: Flag indicando recomendação para faixas.
    - name: recommended_for_behavior_clustering
      description: Flag indicando recomendação para clustering.
    - name: caveat
      description: Ressalva metodológica da variável.
  - name: base_modelada_v2
    description: Painel mensal principal da base modelada com contexto e uso por professor.
    columns:
    - name: teacher_unique_id
      description: Identificador único do professor.
    - name: month
      description: Mês de referência.
    - name: teacher_population_status
      description: Status do professor na população observada.
    - name: teacher_utm_origin
      description: Origem UTM do cadastro.
    - name: teacher_utm_group
      description: Grupo analítico da origem UTM.
    - name: teacher_tela_origem
      description: Tela de origem do cadastro.
    - name: teacher_estado
      description: Estado informado.
    - name: teacher_total_alunos
      description: Total de alunos informado.
    - name: teacher_tipo_total_alunos
      description: Tipo do total de alunos informado.
    - name: teacher_alunos_diretos
      description: Quantidade de alunos diretos.
    - name: teacher_alunos_indiretos
      description: Quantidade de alunos indiretos.
    - name: teacher_login_google
      description: Uso de login via Google.
    - name: teacher_currentstage
      description: Etapa atual do professor.
    - name: teacher_currentsubject
      description: Disciplina atual do professor.
    - name: teacher_currentsubject_group
      description: Grupo analítico da disciplina atual.
    - name: teacher_selectedstages
      description: Etapas selecionadas no cadastro.
    - name: teacher_selectedsubjectsem
      description: Disciplinas selecionadas no Ensino Médio.
    - name: teacher_selectedsubjectsfundii
      description: Disciplinas selecionadas no Fundamental II.
    - name: teacher_visualizou_metodologia_ativa
      description: Visualização de metodologia ativa.
    - name: teacher_data_entrada
      description: Data de entrada do professor.
    - name: has_registered_entry
      description: Flag indicando presença de sessão registrada.
    - name: has_registered_interaction
      description: Flag indicando presença de interação registrada.
    - name: has_formation
      description: Flag indicando presença de formação.
    - name: is_estado_missing
      description: Flag de ausência de estado informado.
    - name: is_utm_missing
      description: Flag de ausência de origem UTM.
    - name: is_tela_origem_missing
      description: Flag de ausência de tela de origem.
    - name: is_total_alunos_missing
      description: Flag de ausência de total de alunos.
    - name: is_tipo_total_alunos_missing
      description: Flag de ausência de tipo do total de alunos.
    - name: is_alunos_diretos_missing
      description: Flag de ausência de quantidade de alunos diretos.
    - name: is_alunos_indiretos_missing
      description: Flag de ausência de quantidade de alunos indiretos.
    - name: is_login_google_missing
      description: Flag de ausência de login via Google.
    - name: is_currentstage_missing
      description: Flag de ausência de etapa atual.
    - name: is_currentsubject_missing
      description: Flag de ausência de disciplina atual.
    - name: is_selectedstages_missing
      description: Flag de ausência de etapas selecionadas.
    - name: is_selectedsubjectsem_missing
      description: Flag de ausência de disciplinas selecionadas do Ensino Médio.
    - name: is_selectedsubjectsfundii_missing
