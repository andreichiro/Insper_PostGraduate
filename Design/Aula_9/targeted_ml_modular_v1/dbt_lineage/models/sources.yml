      description: Ano do calendário.
    - name: calendar_month
      description: Mês do calendário.
    - name: month_start
      description: Início do mês de referência.
    - name: uf
      description: UF de referência.
    - name: rede
      description: Rede de ensino.
    - name: business_days
      description: Quantidade de dias úteis no mês.
    - name: official_holiday_weekdays
      description: Quantidade de feriados em dias úteis.
    - name: school_days_estimate
      description: Estimativa de dias letivos no mês.
    - name: calendar_source
      description: Fonte do calendário.
    - name: school_phase
      description: Fase do período escolar.
  - name: dim_device
    description: Dimensão de dispositivo padronizado.
    columns:
    - name: device_group
      description: Agrupamento padronizado do dispositivo.
    - name: description
      description: Descrição textual.
  - name: dim_event
    description: Dimensão semântica dos eventos observados nas interações.
    columns:
    - name: event_type
      description: Tipo bruto do evento.
    - name: event_family
      description: Família semântica do evento.
    - name: event_action
      description: Ação semântica do evento.
    - name: raw_rows_total
      description: Quantidade total de linhas raw.
    - name: core_rows_total
      description: Quantidade total de linhas mantidas na camada core.
    - name: core_activity_rows_total
