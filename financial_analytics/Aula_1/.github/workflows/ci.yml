name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Docker Compose config
        run: docker compose config

      - name: Ruff
        run: uv run --extra dev python -m ruff check .

      - name: Ruff format
        run: uv run --extra dev python -m ruff format --check .

      - name: Pytest
        run: uv run --extra dev python -m pytest

      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --format requirements.txt --output-file requirements-ci.txt
          uvx --from pip-audit pip-audit -r requirements-ci.txt

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aula-2-ci .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aula-2-ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - docker-build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Boot docker compose stack
        run: KEDRO_ENV=ci docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/api-health.json; then
              cat /tmp/api-health.json
              exit 0
            fi
            sleep 10
          done
          docker compose logs api
          exit 1

      - name: Wait for Streamlit health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs dashboard
          exit 1

      - name: Shutdown compose stack
        if: always()
        run: docker compose down -v
