[project]
name = "pads-forecasting"
version = "0.1.0"
description = "Lab2 PADS Forecasting Kedro project for the Distribuidora BR acquisition case."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "arviz>=0.21",
  "kedro>=1.0",
  "kedro-datasets[pandas]>=7.0",
  "kedro-mlflow>=0.14",
  "lightgbm>=4.0",
  "matplotlib>=3.8",
  "mlforecast>=0.13",
  "mlflow>=2.20",
  "numpy>=1.26",
  "pandas>=2.2",
  "prophet>=1.1",
  "pydantic>=2.0",
  "pymc>=5.0",
  "pytest>=8.0",
  "ruff>=0.8",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13",
  "shap>=0.46",
  "statsmodels>=0.14",
  "utilsforecast>=0.2",
]

[tool.kedro]
package_name = "pads_forecasting"
project_name = "PADS Forecasting Lab2"
kedro_init_version = "1.2.0"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
