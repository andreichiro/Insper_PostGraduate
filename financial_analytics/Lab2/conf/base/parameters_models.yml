models:
  seasonal_naive:
    enabled: true
    season_length: 12
    covid_modes: [none, adjusted_target]
  ets:
    enabled: true
    grid:
      trend: [add]
      seasonal: [add]
      damped_trend: [false, true]
      use_boxcox: [false, true]
    covid_modes: [none, adjusted_target]
  sarimax:
    enabled: true
    grid:
      p: [0, 1, 2]
      d: [0, 1]
      q: [0, 1, 2]
      P: [0, 1]
      D: [1]
      Q: [0, 1]
      m: [12]
      trend: [n, c]
    covid_modes: [none, adjusted_target, covid]
  prophet:
    enabled: true
    optional: true
    grid:
      yearly_seasonality: [3, 5, 8]
      seasonality_mode: [additive, multiplicative]
      changepoint_prior_scale: [0.01, 0.05, 0.1]
      seasonality_prior_scale: [1.0, 5.0, 10.0]
      covid_regressors: [false, true]
    covid_modes: [none, adjusted_target, regressors]
  lightgbm:
    enabled: true
    covid_modes: [none, adjusted_target, features]
    grid:
      lags: [[1, 2, 3, 6, 12, 13]]
      rolling_windows: [[3, 6, 12]]
      max_depth: [2, 3]
      num_leaves: [4, 7, 15]
      n_estimators: [25, 50, 100]
      learning_rate: [0.03, 0.05, 0.1]
      min_data_in_leaf: [8, 12, 18]
      lambda_l1: [0.0, 0.1]
      lambda_l2: [0.0, 0.5, 1.0]
      forecast_strategy: [recursive]
  ridge:
    enabled: true
    covid_modes: [none, adjusted_target, features]
    alpha_grid: [0.1, 1.0, 10.0, 100.0]
    lags: [1, 2, 3, 6, 12, 13]
  elasticnet:
    enabled: true
    covid_modes: [none, adjusted_target, features]
    alpha_grid: [0.1, 1.0, 10.0]
    l1_ratio_grid: [0.2, 0.5, 0.8]
    lags: [1, 2, 3, 6, 12, 13]
  bvar:
    enabled: true
    optional: true
    cv_draw_cap: 100
    cv_tune_cap: 100
    grid:
      lags: [1, 2]
      minnesota_lambda: [0.1, 0.2, 0.5]
      cross_lag_shrinkage: [0.05, 0.1]
      covid_exog: [true]
      draws: [1000]
      tune: [1000]
    covid_modes: [none, adjusted_target, exog]

hpo:
  enabled: true
  optimizer: grid
  objective: leakage_safe_penalized_mase
